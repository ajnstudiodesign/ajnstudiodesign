<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About | AJN Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff;
    --ink: #1b1b18;
    --muted: #6d685f;
    --crumb: #5f6553;
    --ghost: #f1f1ef;
    --glow: rgba(238, 205, 175, .32);
    --pad: clamp(20px, 3.65vw, 70px);
    --font: "Jost", Futura, "Century Gothic", "Trebuchet MS", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #151513;
      --ink: #f1efe9;
      --muted: #a39e94;
      --crumb: #a7ad98;
      --ghost: #1f1f1c;
      --glow: rgba(190, 140, 100, .14);
    }
  }
  :root[data-theme="dark"] {
    --paper: #151513;
    --ink: #f1efe9;
    --muted: #a39e94;
    --crumb: #a7ad98;
    --ghost: #1f1f1c;
    --glow: rgba(190, 140, 100, .14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    font-weight: 300;
    font-size: 1.125rem;
    line-height: 1.7;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

  .hero {
    position: relative;
    min-height: clamp(420px, 32vw, 620px);
    padding: clamp(60px, 5vw, 96px) var(--pad) 0;
    overflow: hidden;
    background: radial-gradient(58% 60% at 26% 108%, var(--glow), transparent 72%);
  }
  .ghost {
    position: absolute;
    left: 12.5vw;
    top: clamp(24px, 2.4vw, 46px);
    font-size: clamp(8rem, 19vw, 22rem);
    font-weight: 600;
    line-height: .85;
    letter-spacing: -.02em;
    color: var(--ghost);
    user-select: none;
    pointer-events: none;
    white-space: nowrap;
  }
  .hero-inner { position: relative; z-index: 2; }
  .crumbs {
    display: flex;
    gap: 14px;
    font-size: 1.05rem;
    letter-spacing: .06em;
    color: var(--crumb);
  }
  .crumbs a:hover { text-decoration: underline; text-underline-offset: 4px; }
  .hero-grid {
    display: grid;
    grid-template-columns: 57fr 43fr;
    align-items: center;
    gap: 32px;
    margin-top: clamp(28px, 3.6vw, 70px);
  }
  h1 {
    font-size: clamp(2.8rem, 4.4vw, 4.6rem);
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -.035em;
  }
  .lede {
    font-size: clamp(1.15rem, 1.3vw, 1.4rem);
    line-height: 1.9;
    color: var(--muted);
    max-width: 34em;
  }

  @media (max-width: 860px) {
    .ghost { left: 4vw; font-size: 34vw; }
    .hero { min-height: 0; padding-bottom: 72px; }
    .hero-grid { grid-template-columns: 1fr; align-items: start; }
  }
</style>
</head>
<body>

<section class="hero">
  <div class="ghost" aria-hidden="true">ABOUT</div>
  <div class="hero-inner">
    <div class="crumbs"><a href="index.html">Home</a><span aria-hidden="true">/</span><span>About</span></div>
    <div class="hero-grid">
      <h1>About the Studio</h1>
      <p class="lede">An architecture and interior design studio for residences and hospitality spaces across the UAE &mdash; drawn from the site up, not from a template.</p>
    </div>
  </div>
</section>

</body>
</html>
